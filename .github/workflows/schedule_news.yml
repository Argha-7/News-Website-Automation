name: Auto News Poster

on:
  schedule:
    - cron: '*/20 * * * *'  # Run every 20 minutes
  workflow_dispatch:      # Allow manual trigger from Mobile App

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run News Automation
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
        BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
        BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}
      run: |
        # Create serviceAccountKey.json from secret if it exists
        if [ ! -z "${FIREBASE_KEY_JSON}" ]; then
          echo "${FIREBASE_KEY_JSON}" > serviceAccountKey.json
        fi
        
        # Setup Auth
        python setup_auth.py
        
        # Run Main Script
        python main.py
